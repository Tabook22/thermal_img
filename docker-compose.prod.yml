services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/thermal.db}
      STORAGE_ROOT: /data
      DJI_IRP_PATH: /opt/dji-thermal-sdk/utility/bin/linux/release_x64/dji_irp
      DJI_SDK_VERSION: ${DJI_SDK_VERSION:-unavailable}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
      DECODER_TIMEOUT_SECONDS: ${DECODER_TIMEOUT_SECONDS:-45}
      DECODER_CONCURRENCY: ${DECODER_CONCURRENCY:-2}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://skygreenline-lab.io}
      SESSION_COOKIE_SECURE: "true"
      SESSION_COOKIE_PATH: /thermal/
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_WEB_MODEL: ${OPENAI_WEB_MODEL:-gpt-4.1-mini}
    ports:
      - "127.0.0.1:8003:8000"
    volumes:
      - thermal_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    logging: &logging
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_BASE_PATH: /thermal/
    ports:
      - "127.0.0.1:5174:8080"
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/thermal/"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging: *logging

volumes:
  thermal_data:
