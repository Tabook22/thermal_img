# Include this file inside the existing HTTPS server block only.
location = /thermal {
    return 301 /thermal/;
}

location ^~ /thermal/api/ {
    # Individual application accounts protect every private API route.
    auth_basic off;
    client_max_body_size 110M;
    proxy_pass http://127.0.0.1:8003/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /thermal;
    proxy_connect_timeout 10s;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
}

location ^~ /thermal/ {
    auth_basic off;
    proxy_pass http://127.0.0.1:5174/thermal/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 180s;
}
